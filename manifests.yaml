apiVersion: v1
data:
  job.sh: "#!/usr/bin/env bash\n# shellcheck disable=SC1091\n\nset -e\n\nocp_aws_cluster(){\n
    \ TARGET_NS=kube-system\n  OBJ=secret/aws-creds\n  echo \"Checking if ${OBJ} exists
    in ${TARGET_NS} namespace\"\n  oc -n \"${TARGET_NS}\" get \"${OBJ}\" -o name >
    /dev/null 2>&1 || return 1\n  echo \"AWS cluster detected\"\n}\n\nocp_aws_create_gpu_machineset(){\n
    \ # https://aws.amazon.com/ec2/instance-types/g4\n  # single gpu: g4dn.{2,4,8,16}xlarge\n
    \ # multi gpu:  g4dn.12xlarge\n  # practical:  g4ad.4xlarge\n  # a100 (MIG): p4d.24xlarge\n
    \ # h100 (MIG): p5.48xlarge\n\n  # https://aws.amazon.com/ec2/instance-types/dl1\n
    \ # 8 x gaudi:  dl1.24xlarge\n\n  INSTANCE_TYPE=${1:-g4dn.4xlarge}\n\n  ocp_aws_clone_machineset
    \"${INSTANCE_TYPE}\"\n\n  MACHINE_SET_TYPE=$(oc -n openshift-machine-api get machinesets.machine.openshift.io
    -o name | grep \"${INSTANCE_TYPE%.*}\" | head -n1)\n\n  PATCH_FILE=\"$(dirname
    \"$0\")/machineset-patch.yaml\"\n\n  if [ -f ${PATCH_FILE} ]; then\n    echo \"Patching
    ${MACHINE_SET_TYPE} with ${PATCH_FILE}.\"\n    oc -n openshift-machine-api \\\n
    \     patch \"${MACHINE_SET_TYPE}\" \\\n      --type=merge --patch-file ${PATCH_FILE}\n
    \ else\n    echo \"Unable to taint nodes, patch file ${PATCH_FILE} not found.\"\n
    \   exit 1\n  fi\n \n  oc -n openshift-machine-api \\\n    patch \"${MACHINE_SET_TYPE}\"
    \\\n    --type=merge --patch '{\"spec\":{\"template\":{\"spec\":{\"providerSpec\":{\"value\":{\"instanceType\":\"'\"${INSTANCE_TYPE}\"'\"}}}}}}'\n\n
    \ NODE_VOLUME_SIZE=${NODE_VOLUME_SIZE:-100}\n  echo \"Patching ${MACHINE_SET_TYPE}
    blockDevices volumeSize to ${NODE_VOLUME_SIZE}.\"\n  oc -n openshift-machine-api
    \\\n    patch \"${MACHINE_SET_TYPE}\" \\\n    --type=json \\\n    --patch '[{\"op\":\"replace\",\"path\":\"/spec/template/spec/providerSpec/value/blockDevices/0/ebs/volumeSize\",\"value\":'\"${NODE_VOLUME_SIZE}\"'}]'\n}\n\nocp_aws_clone_machineset(){\n
    \ [ -z \"${1}\" ] && \\\n  echo \"\n    usage: ocp_aws_create_gpu_machineset <
    instance type, default g4dn.4xlarge >\n  \"\n\n  INSTANCE_TYPE=${1:-g4dn.4xlarge}\n
    \ MACHINE_SET=$(oc -n openshift-machine-api get machinesets.machine.openshift.io
    -o name | grep worker | head -n1)\n\n  # check for an existing instance machine
    set\n  if oc -n openshift-machine-api get machinesets.machine.openshift.io -o
    name | grep -q \"${INSTANCE_TYPE%.*}\"; then\n    echo \"Exists: machineset -
    ${INSTANCE_TYPE}\"\n  else\n    echo \"Creating: machineset - ${INSTANCE_TYPE}\"\n
    \   oc -n openshift-machine-api \\\n      get \"${MACHINE_SET}\" -o yaml | \\\n
    \       sed '/machine/ s/-worker/-'\"${INSTANCE_TYPE}\"'/g\n          /name/ s/-worker/-'\"${INSTANCE_TYPE%.*}\"'/g\n
    \         s/instanceType.*/instanceType: '\"${INSTANCE_TYPE}\"'/\n          s/replicas.*/replicas:
    0/' | \\\n      oc apply -f -\n  fi\n}\n\nocp_create_machineset_autoscale(){\n
    \ MACHINE_MIN=${1:-0}\n  MACHINE_MAX=${2:-4}\n  MACHINE_SETS=${3:-$(oc -n openshift-machine-api
    get machinesets.machine.openshift.io -o name | sed 's@.*/@@' )}\n\n  for set in
    ${MACHINE_SETS}\n  do\ncat << YAML | oc apply -f -\napiVersion: \"autoscaling.openshift.io/v1beta1\"\nkind:
    \"MachineAutoscaler\"\nmetadata:\n  name: \"${set}\"\n  namespace: \"openshift-machine-api\"\nspec:\n
    \ minReplicas: ${MACHINE_MIN}\n  maxReplicas: ${MACHINE_MAX}\n  scaleTargetRef:\n
    \   apiVersion: machine.openshift.io/v1beta1\n    kind: MachineSet\n    name:
    \"${set}\"\nYAML\n  done\n}\n\nINSTANCE_TYPE=${INSTANCE_TYPE:-g4dn.4xlarge}\n\nocp_aws_cluster
    || exit 0\nocp_aws_create_gpu_machineset ${INSTANCE_TYPE}\nocp_create_machineset_autoscale\n"
  machineset-patch.yaml: |
    apiVersion: machine.openshift.io/v1beta1
    kind: MachineSet
    metadata:
      labels:
        cluster-api/accelerator: "nvidia-gpu"
    spec:
      template:
        spec:
          metadata:
            labels:
              node-role.kubernetes.io/gpu: ""
              cluster-api/accelerator: "nvidia-gpu"
          taints:
            - key: nvidia.com/gpu
              effect: NoSchedule
