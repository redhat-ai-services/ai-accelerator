apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: mcp-extension
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    namespace: mcp-gateway
    sectionName: mcp
    privateHost: http://mcp-gateway-mcp-gateway-class.mcp-gateway.svc.cluster.local:8080
  httpRouteManagement: Enabled
