- op: add
  path: /spec/resourceHealthChecks/-
  value:
    group: kuadrant.io
    kind: Kuadrant
    check: |
      health_status = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          msg = ""
          ready = false
          progressing = false
          degraded = false
          for i, condition in pairs(obj.status.conditions) do
            if condition.type == "Ready" and condition.status == "True" then
              ready = true
            elseif condition.type == "Progressing" then
              if condition.status == "True" then
                progressing = true
                msg = msg .. i .. ": " .. (condition.type or "") .. " | " .. (condition.status or "") .. " | " .. (condition.reason or "") .. " | " .. (condition.message or "") .. "\n"
              end
            elseif condition.type == "Degraded" then
              if condition.status == "True" then
                degraded = true
                msg = msg .. i .. ": " .. (condition.type or "") .. " | " .. (condition.status or "") .. " | " .. (condition.reason or "") .. " | " .. (condition.message or "") .. "\n"
              end
            elseif condition.status == "False" then
              degraded = true
              msg = msg .. i .. ": " .. (condition.type or "") .. " | " .. (condition.status or "") .. " | " .. (condition.reason or "") .. " | " .. (condition.message or "") .. "\n"
            end
          end

          if ready == true then
            health_status.status = "Healthy"
          elseif progressing == true then
            health_status.status = "Progressing"
          elseif degraded == true then
            health_status.status = "Degraded"
          else
            health_status.status = "Progressing"
          end

          health_status.message = msg
        else
          health_status.status = "Progressing"
          health_status.message = "Kuadrant is creating..."
        end
      else
        health_status.status = "Progressing"
        health_status.message = "Kuadrant is creating..."
      end

      return health_status
